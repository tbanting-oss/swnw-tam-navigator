  function parseCSV(text) {
    const rows = []; let row = [], field = '', inQuotes = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i], n = text[i + 1];
      if (inQuotes) {
        if (c === '"' && n === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }

      } else {
        if (c === '"') inQuotes = true;

      if (somTable) {
        const keyMap = { 'UCaaS': 'ucaas', 'UC on-premises': 'ucop', 'CCaaS': 'ccaas', 'CC on-premises': 'ccop', 'CPaaS': 'cpaas' };
        out.somDef = somTable.dataRows.filter(r => r[0] && r[0].trim() !== 'TOTAL').map(r => ({
          key: keyMap[r[0].trim()] || r[0].trim().toLowerCase(), name: r[0].trim(),
          held: numVal(r[somTable.colIdx['Top-5 held']]) / 100, contest: numVal(r[somTable.colIdx['Incumbent contestability']]) / 100
        })).filter(r => !isNaN(r.held) && !isNaN(r.contest));
      }
    } catch (e) { console.warn('Live fetch failed: SOM & Competitive', e); }
    try {
      const rt = await fetchTab('Readiness Tier');
      const rtTable = findTable(rt, ['TAM Navigator Country Name', 'Readiness Tier']);
      if (rtTable) {
        const tiers = rtTable.dataRows.map(r => numVal(r[rtTable.colIdx['Readiness Tier']])).filter(t => !isNaN(t) && t >= 1 && t <= 5);
        if (tiers.length > 0) {
          out.readinessTiers = tiers;
        }
      }
    } catch (e) { console.warn('Live fetch failed: Readiness Tier', e); }
    try {
      const at = await fetchTab('Adoption by Tier');
      const flat = at.map(r => r.map(c => c.trim()));
      const findLabelValue = (label) => {
        for (const r of flat) { if (r[0] && r[0].toLowerCase() === label.toLowerCase()) { for (let j = 1; j < r.length; j++) { if (r[j]) return numVal(r[j]); } } }
        return NaN;
      };
      const seats0 = findLabelValue('SEATS0');
      const ucShare0Adoption = findLabelValue('UC_SHARE0');
      if (!isNaN(seats0) && seats0 > 0) out.seats0Adoption = seats0;
      if (!isNaN(ucShare0Adoption) && ucShare0Adoption > 0 && ucShare0Adoption < 1) out.ucShare0Adoption = ucShare0Adoption;
    } catch (e) { console.warn('Live fetch failed: Adoption by Tier', e); }
    return out;
  }

  // ============================================================
  // STATE + MODEL MATH (ported 1:1 from the Claude Design source)
  // ============================================================
  let LIVE = {}; // populated after loadLiveModel() resolves
  let liveStatus = 'loading'; // 'loading' | 'live' | 'fallback'

  function REGIONS() { return LIVE.regionsForecast && LIVE.regionsForecast.length === 10 ? LIVE.regionsForecast : REGIONS_BASE; }
  function ROOM_SIZES() { return LIVE.roomSizes && LIVE.roomSizes.length === 3 ? LIVE.roomSizes.map(s => ({ ctrl: 0.5, ctrlAsp: 800, ...s })) : ROOM_SIZES_BASE; }
  // Live-sheet override intentionally disabled for platforms: the sheet's
  // "Ecosystem" table (if present) was built for the old share/price shape,
  // which no longer matches this table's note-based structure -- always
  // use the constants here rather than risk rendering undefined notes from
  // a stale-shaped sheet fetch.
  function ECOSYSTEMS() { return ECOSYSTEMS_BASE; }
  function HW_VENDORS() { return LIVE.hwVendors && LIVE.hwVendors.length >= 2 ? LIVE.hwVendors : HW_VENDORS_BASE; }
  function SOM_DEF() { return LIVE.somDef && LIVE.somDef.length === 5 ? LIVE.somDef : SOM_DEF_BASE; }
  function DEFAULTS() { return { ...DEFAULTS_BASE, ...(LIVE.demandDefaults || {}) }; }
  function SEATS0() { return LIVE.seats0Adoption || BASE.SEATS0; }
  function AGENTS0() { return BASE.AGENTS0; }
  function CPAAS0() { return BASE.CPAAS0; }
  function DEV0() { return BASE.DEV0; }
  function UC_SHARE0() { return LIVE.ucShare0Adoption || (LIVE.demandDefaults && LIVE.demandDefaults.ucShare0) || BASE.UC_SHARE0; }
  function CC_SHARE0() { return (LIVE.demandDefaults && LIVE.demandDefaults.ccShare0) || BASE.CC_SHARE0; }
  function DEFL0() { return BASE.DEFL0; }
  function SAM_WEIGHT() {
    const tiers = LIVE.readinessTiers;
    if (tiers && tiers.length > 0) {
      const sum = tiers.reduce((a, t) => a + (SAM_WEIGHT_BY_TIER[t] || 0), 0);
      return sum / tiers.length;
    }
    return BASE.SAM_WEIGHT;
  }

  const state = { tab: 'overview', scenario: 'Base', theme: 'dark', ...DEFAULTS_BASE };

  function setState(patch) { Object.assign(state, typeof patch === 'function' ? patch(state) : patch); render(); }

  function cagr(a, b) { return Math.pow(b / a, 1 / 5) - 1; }
  function fb(v, d) { return '$' + v.toFixed(d === undefined ? 1 : d) + 'B'; }
  function pct(v, d) { return (v * 100).toFixed(d === undefined ? 1 : d) + '%'; }
  function spct(v) { return (v >= 0 ? '+' : '') + (v * 100).toFixed(1) + '%'; }
  function growthColor(v) { return v < 0 ? 'var(--c-down)' : C.teal; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

  function aiGross(agentsM, defl) {
    const st = state;
    const deflAgents = agentsM * defl;
    const resolutions = deflAgents * st.contacts / 1000;
    const aiAgents = resolutions * 1000 / st.aiCapacity;
    let gross;
    if (st.aiMode === 'resolution') gross = resolutions * st.pricePerRes;
    else if (st.aiMode === 'aiagent') gross = aiAgents * st.aiAgentPrice * 12 / 1000;
    else gross = deflAgents * AI.agentArpu / 1000;
    return { deflAgents, resolutions, aiAgents, gross };
  }
  function unit(i, opts) {
    const st = state;
    const decl = opts && opts.decl !== undefined ? opts.decl : st.declRate;
    const grow = opts && opts.grow !== undefined ? opts.grow : st.intensity;
    const tokIn = st.tokRes * Math.pow(1 + grow, i);
    const tokOut = tokIn * AI.outRatio;
    const effIn = AI.priceIn * (1 - AI.cacheHit * 0.9) * Math.pow(1 - decl, i);
    const effOut = AI.priceOut * Math.pow(1 - decl, i);
    const tokenCost = (tokIn / 1e6 * effIn + tokOut / 1e6 * effOut) / AI.containment;
    const voiceCost = st.voiceShare * st.aht * AI.voicePerMin * Math.pow(1 - AI.voiceDecl, i);
    return { tokIn, tokOut, tokenCost, voiceCost, cost: tokenCost + voiceCost };
  }
  // ============================================================
  // MULTI-CAAS CONVERGENCE — Modelled-Directional
  // ------------------------------------------------------------
  // A growing share of CC agents sit on native, bundled Multi-CaaS
  // platforms (Zoom Contact Center, RingCX, 8x8 XCaaS) rather than
  // standalone CCaaS (Genesys, NICE, Five9). This is NOT a seat
  // double-count — UC seats and CC agents remain distinct pools.
  // It is ARPU compression: agents on a converged platform pay
  // Multi-CaaS-tier pricing instead of full standalone CCaaS pricing.
  //
  // Band weights (share of 2025 global CCaaS revenue) and per-band
  // convergence trajectories, reconciled to a weighted 2030 revenue-
  // convergence endpoint of 37.5%. Two hard anchors: Genesys Cloud CX
  // ~$2,000/mo minimum (~27 seats on CX1); Five9's 50-concurrent-seat
  // contractual floor. Everything else here is reasoned inference,
  // not independently sourced — do not present as benchmarked.
  const MULTICAAS_BANDS = [
    { name: '0-50 seats',   weight: 0.15, conv: [0.400, 0.490, 0.580, 0.670, 0.760, 0.850] },
    { name: '50-300 seats', weight: 0.30, conv: [0.200, 0.240, 0.320, 0.440, 0.510, 0.550] },
    { name: '300+ seats',   weight: 0.55, conv: [0.050, 0.070, 0.090, 0.110, 0.130, 0.150] },
  ];
  // Weighted revenue-convergence share by year, with the pace scaler applied
  // per band: scales how far each band moves from its 2025 starting point
  // toward its 2030 endpoint (1.0 = calibrated base case; >1 = faster;
  // <1 = slower/stalled), clamped to [0,1] so it can't invert or exceed 100%.
  function multiCaaSConvByYear() {
    const pace = state.multiCaaSPace;
    return [0,1,2,3,4,5].map(i => MULTICAAS_BANDS.reduce((sum, b) => {
      const base = b.conv[0], target = b.conv[i];
      const scaled = Math.max(0, Math.min(1, base + (target - base) * pace));
      return sum + b.weight * scaled;
    }, 0));
  }

  function run(scenarioName) {
    const s = SCEN[scenarioName], st = state;
    const seats0 = SEATS0(), agents0 = AGENTS0() * st.agentScale;
    const years = [2025, 2026, 2027, 2028, 2029, 2030];
    const multiCaaSConv = multiCaaSConvByYear();
    const rows = years.map((year, i) => {
      const t = i / 5;
      const ucShare = UC_SHARE0() + (s.ucEnd - UC_SHARE0()) * t;
      const ccShare = CC_SHARE0() + (s.ccEnd - CC_SHARE0()) * t;
      const seats = seats0 * Math.pow(1 + s.ucG, i);
      const agentsPreDisplacement = agents0 * Math.pow(1 + s.agG, i);
      // AI displacement: user-tested scenario, not a SWNW forecast. Default 0%
      // asserts nothing -- model behaves exactly as it does with the lever
      // untouched. Ramps linearly from 2025 (0% always) to the 2030 endpoint
      // set by the lever, same mechanism as every other trajectory in this
      // model (ucEnd, ccEnd, defl). Applied here, at the earliest point agents
      // enters the calculation, so revenue, the seat/agent rows, and the
      // AI-handled-equivalent row all inherit it consistently -- one
      // intervention point, not a second competing discount mechanic layered
      // on top of the existing AI-deflection revenue factor below.
      const agents = agentsPreDisplacement * (1 - st.aiDisplacement * t);
      const defl = DEFL0() + (s.defl - DEFL0()) * t;
      const dFactor = 1 - (defl - DEFL0());
      const outcome = 1 - 0.10 * t;
      const uplift = 1 + 0.25 * t;
      const capture = 0.75 - 0.20 * t;
      const ucaas = seats * ucShare * st.ucArpu / 1000;
      const ucop = seats * (1 - ucShare) * st.opArpu / 1000;
      const multiCaaSShare = multiCaaSConv[i];
      // Split cloud CC revenue into standalone CCaaS and bundled Multi-CaaS,
      // by agent share converged rather than by blending one ARPU — this
      // keeps both as real, additive line items instead of a single number
      // with an invisible discount baked in. Sum is identical to a single
      // blended-ARPU calculation; ratio is now the multiCaaSArpuRatio lever.
      const ccAgentsCloud = agents * ccShare;
      const ccaas = ccAgentsCloud * (1 - multiCaaSShare) * st.ccArpu * dFactor * outcome / 1000;
      const multicaas = ccAgentsCloud * multiCaaSShare * st.ccArpu * st.multiCaaSArpuRatio * dFactor * outcome / 1000;
      const ccop = agents * (1 - ccShare) * st.ccOpArpu * dFactor / 1000;
      const cpaas = CPAAS0() * Math.pow(1 + s.cpG, i) * uplift;
      const aiG = aiGross(agents, defl);
      const aiBase = aiG.gross;
      const ai = aiBase * capture, leak = aiBase * (1 - capture);
      const devices = DEV0() * Math.pow(1 + s.devG, i);
      // Cloud-only seat/agent counts, exposed as their own rows (see Projection
      // detail) — distinct from the seats/agents totals above, which are
      // cloud+on-prem combined. deflAgents is the AI-handled agent-equivalent:
      // contact volume deflected by AI, expressed as how many additional human
      // agents would have been needed to handle it. Shown alongside the human
      // agent count, never subtracted from it — this is not a claim that AI
      // has displaced existing headcount, only that it is absorbing volume
      // growth. Uses the same defl trajectory already driving AI-CX revenue
      // above, not a separate assumption.
      const ucaasSeats = seats * ucShare;
      const ccaasAgentsCloud = ccAgentsCloud;
      const deflAgents = aiG.deflAgents;
      return { year, seats, agents, ucShare, ccShare, ucaas, ucop, ccaas, ccop, cpaas, ai, leak, devices,
        multicaas, multiCaaSShare, ucaasSeats, ccaasAgentsCloud, deflAgents,
        software: ucaas + ucop + ccaas + ccop + cpaas + multicaas, cloud: ucaas + ccaas + cpaas + multicaas, onprem: ucop + ccop,
        total: ucaas + ucop + ccaas + ccop + cpaas + multicaas + ai + devices };
    });
    return { rows, first: rows[0], last: rows[5] };
  }
  function aiEcon(rows, opts) {
    const st = state;
    return rows.map((r, i) => {
      const u = unit(i, opts);
      const defl = DEFL0() + (SCEN[state.scenario].defl - DEFL0()) * (i / 5);
      const g = aiGross(r.agents, defl);
      const capture = 0.75 - 0.20 * (i / 5);
      const revenue = g.gross * capture;
      const cogs = g.resolutions * u.cost;
      const realised = g.resolutions > 0 ? g.gross / g.resolutions : 0;
      return { year: r.year, ...u, resolutions: g.resolutions, aiAgents: g.aiAgents, deflAgents: g.deflAgents, revenue, cogs,
        grossProfit: revenue - cogs, margin: revenue > 0 ? (revenue - cogs) / revenue : 0, realised,
        buyerSaving: g.resolutions * (AI.humanCost - realised) };
    });
  }
  function bar(frac, color, height, radius) {
    return 'width:' + Math.max(0.6, frac * 100) + '%;height:' + (height || '100%') + ';background:' + color + ';border-radius:' + (radius || '3px');
  }

  // ============================================================
  // RENDER — one function per tab, string-templated (no framework)
  // ============================================================
  function build() {
    const st = state, tab = st.tab, scen = st.scenario;
    const act = applySizeSegmentToRun(run(scen), st.sizeSegment), f = act.first, l = act.last;
    const alt = { Conservative: applySizeSegmentToRun(run('Conservative'), st.sizeSegment),
                  Base: applySizeSegmentToRun(run('Base'), st.sizeSegment),
                  Bull: applySizeSegmentToRun(run('Bull'), st.sizeSegment) };
    const maxScen = Math.max(alt.Conservative.last.total, alt.Base.last.total, alt.Bull.last.total);
    const dep = DEPLOY[st.deploy] || DEPLOY.hybrid;
    const w = dep.w;
    const scoped = (row) => row.ucaas * w.ucaas + row.ucop * w.ucop + row.ccaas * w.ccaas + row.ccop * w.ccop + row.cpaas * w.cpaas + row.multicaas * w.multicaas;
    const segMult = st.sizeSegment === 'all' ? 1 : SIZE_SEGMENTS[st.sizeSegment].ucShare;
    const tam = st.deploy === 'onprem'
      ? f.seats * st.opArpu / 1000 + f.agents * st.ccOpArpu / 1000
      : f.seats * st.ucArpu / 1000 + f.agents * st.ccArpu / 1000 + CPAAS0() * st.cpaasMult * segMult
        + (w.ucop ? f.seats * (1 - UC_SHARE0()) * st.opArpu / 1000 + f.agents * (1 - CC_SHARE0()) * st.ccOpArpu / 1000 : 0);
    const sam = tam * SAM_WEIGHT();
    const addressableNow = scoped(f), addressable2030 = scoped(l);

    const prodDefs = [
      { key: 'ucaas', name: 'UCaaS', color: C.purple }, { key: 'cpaas', name: 'CPaaS', color: C.teal },
      { key: 'ucop', name: 'UC on-premises', color: C.grey }, { key: 'ccaas', name: 'CCaaS', color: C.indigo },
      { key: 'multicaas', name: 'Multi-CaaS (bundled UC+CC)', color: C.indigoLift },
      { key: 'ccop', name: 'CC on-premises', color: C.greyDark }, { key: 'ai', name: 'Conversational AI / AI-CX', color: C.lilac },
      { key: 'devices', name: 'Video devices (rooms)', color: C.amber }
    ];
    const cagrs = prodDefs.map(p => cagr(f[p.key], l[p.key]));
    const maxAbsCagr = Math.max(...cagrs.map(Math.abs));

    const REG = REGIONS();
    const gCloudCagr = cagr(f.cloud, l.cloud), gOpCagr = cagr(f.onprem, l.onprem);
    const regions = REG.map(r => {
      const cc = gCloudCagr * r.pace, oc = gOpCagr * r.persist;
      const c30 = r.cloud * Math.pow(1 + cc, 5), o30 = r.op * Math.pow(1 + oc, 5);
      return { ...r, t30: c30 + o30, cagr: cagr(r.cloud + r.op, c30 + o30), cloudShare: c30 / (c30 + o30) };
    }).sort((a, b) => b.t30 - a.t30);
    const maxRegion = regions[0].t30, maxGrabs = Math.max(...REG.map(r => r.grabs));

    // ============================================================
    // MEETING ROOMS — Modelled-Calibrated (see Methodology §10)
    // ------------------------------------------------------------
    // Rebuilt again in this pass, on top of the August 2026 rebuild:
    //   officeWorkers = SEATS0/0.70 x rtoIntensity -- rtoIntensity is a
    //                   new user-facing lever (Master Levers > Meeting
    //                   rooms), default 1.0 (today's level), asserting
    //                   nothing on its own. Real evidence this variable
    //                   is genuinely volatile right now: a primary 2026
    //                   occupancy report calls the swing in 3-4 day
    //                   attendance (36%->55% in one year) the largest
    //                   single-year shift in three years of that
    //                   benchmark; a separate staffing-firm dataset
    //                   showed fully-in-office job postings jump from
    //                   65% to 87% in two quarters. This lever lets a
    //                   user stress-test that swing rather than have it
    //                   silently baked into a fixed assumption.
    //   officeSqFt    = officeWorkers x sqFtPerPerson (slider, default
    //                   154 -- midpoint of two independent density
    //                   figures agreeing within 5%: real estate
    //                   research ~158 sqft/person; a current US
    //                   government space-planning standard, 150
    //                   sqft/person).
    //   meetingSqFt   = officeSqFt x meetingShare (slider, default 24%
    //                   -- current reading of a documented, rising
    //                   trend from ~14% in 2021, driven by hybrid work
    //                   converting individual desk space into shared
    //                   space). Not separately discounted for remote/
    //                   hybrid/on-site mix -- both this share and the
    //                   density figure above are observed from real,
    //                   currently occupied buildings and already
    //                   reflect today's actual hybrid-driven
    //                   allocation; a second discount would count the
    //                   same effect twice. (rtoIntensity above is a
    //                   different thing: a user-testable scenario
    //                   lever, not a baked-in empirical correction.)
    //   roomsTotal    = meetingSqFt / blended avg sqft-per-room. This
    //                   stays the PRIMARY driver of the total, not a
    //                   direct employees-per-room ratio: checked
    //                   applying real, sourced employee-per-room
    //                   benchmarks (huddle 1/20-25, medium 1/50-60,
    //                   large 1/150+; independently cross-validated in
    //                   combination against a "1 room per 10-20
    //                   employees" blanket benchmark) directly to our
    //                   global officeWorkers figure, and it produces an
    //                   implausibly small total (below a single stale
    //                   2017 benchmark for one tier alone) -- those
    //                   ratios were almost certainly calibrated against
    //                   single-building headcounts, not a global
    //                   abstraction, so they are NOT used as the total-
    //                   count driver here.
    // What the employee-ratio research IS used for: the relative MIX
    // between the three tiers (see ROOM_SIZES_BASE above), which
    // doesn't have this scaling problem -- and a displayed cross-check
    // below (implied employees/room at the current total) so the
    // residual gap against real-world benchmarks stays visible rather
    // than hidden.
    // Checked against the best external evidence found: with this
    // mix, the huddle/small tier now lands ABOVE the one named-analyst
    // room-count figure available for that category (itself dated
    // 2017/2018, predating that market's documented ~50%/yr growth
    // through 2022) -- the right direction, an improvement on the
    // previous pass, though still not independently confirmed.
    const officeWorkers = SEATS0() / 0.70 * st.rtoIntensity;
    const officeSqFtB = officeWorkers * st.sqFtPerPerson / 1000;
    const meetingSqFtB = officeSqFtB * st.meetingShare;
    const roomsTotal = meetingSqFtB * 1000 / BLENDED_AVG_SQFT_PER_ROOM;
    // Displayed cross-check only, not a driver: real-world employee-
    // per-room benchmarks run 10-20; showing where our own total
    // implies we sit against that range keeps the residual gap honest.
    const impliedEmployeesPerRoom = officeWorkers / roomsTotal;
    const sizes = ROOM_SIZES().map(s => {
      const r = roomsTotal * s.share, grabs = r * (1 - s.enabled) * s.addr;
      return { ...s, roomsM: r, grabsM: grabs, tamB: grabs * s.price / 1000, ctrlB: grabs * s.ctrl * s.ctrlAsp / 1000 };
    });
    const grabsTotal = sizes.reduce((a, s) => a + s.grabsM, 0);
    const deviceTamTotal = sizes.reduce((a, s) => a + s.tamB, 0);
    const ctrlTotal = sizes.reduce((a, s) => a + s.ctrlB, 0);
    const maxSizeTam = Math.max(...sizes.map(s => s.tamB));
    // Refresh-cycle decomposition -- resolves what was previously flagged
    // as an "$11B vs $137B disagreement" (see the footnote on this tab) by
    // making the relationship a real mechanism instead of a one-off
    // observation. Already-equipped rooms replace their hardware on a
    // cycle rather than all at once; refreshCycleYears (slider, default 6,
    // the midpoint of a commonly-cited 5-7 year mid-range refresh-cycle
    // figure -- itself a generic market-report source, weaker than the
    // CBRE/JLL/GSA tier this rebuild otherwise holds to, labelled
    // Modelled-Directional accordingly) sets how fast that cycle turns.
    // equippedSpend is the one-time value of the ALREADY-enabled install
    // base (mirrors deviceTamTotal's math, which covers only the
    // UNenabled/addressable pool); dividing by the cycle length gives an
    // implied annual refresh-driven revenue figure, shown alongside (not
    // replacing) DEV0's own annual trajectory as a cross-check.
    const equippedSpendB = sizes.reduce((a, s) => a + s.roomsM * s.enabled * s.price / 1000, 0);
    const refreshRevenueB = equippedSpendB / st.refreshCycleYears;

    const SOM_HELD_KEY = { ucaas: 'somHeldUcaas', ucop: 'somHeldUcop', ccaas: 'somHeldCcaas', ccop: 'somHeldCcop', cpaas: 'somHeldCpaas' };
    const somRows = SOM_DEF().filter(d => w[d.key] > 0).map(d => {
      const held = st[SOM_HELD_KEY[d.key]] ?? d.held;
      const share = st.winRate * ((1 - held) + d.contest * held);
      return { ...d, held, share, now: share * f[d.key] * w[d.key], y2030: share * l[d.key] * w[d.key] };
    });
    const somNow = somRows.reduce((a, r) => a + r.now, 0), som30 = somRows.reduce((a, r) => a + r.y2030, 0);
    const maxSom = Math.max(...somRows.map(r => r.y2030));

    const ai = aiEcon(act.rows), aiFirst = ai[0], aiLast = ai[5];
    const priceRealised = aiLast.realised;
    const deflAgents30 = l.agents * SCEN[scen].defl;
    const aiAgentRev30 = deflAgents30 * AI.agentArpu / 1000;
    const aiResRev30 = aiLast.resolutions * st.pricePerRes;
    const aiWorkerRev30 = aiLast.aiAgents * st.aiAgentPrice * 12 / 1000;
    const maxModeRev = Math.max(aiResRev30, aiAgentRev30, aiWorkerRev30);
    const gridRows = GRID_DECL.map(d => ({
      label: '−' + (d * 100).toFixed(0) + '%',
      cells: GRID_GROW.map(g => {
        const u = unit(5, { decl: d, grow: g });
        const m = 1 - u.cost / Math.max(0.0001, priceRealised);
        const t = Math.max(0, Math.min(1, (m - 0.3) / 0.65));
        return { label: (m * 100).toFixed(0) + '%', neg: m < 0, t };
      })
    }));

    return { st, tab, scen, act, f, l, alt, maxScen, dep, w, tam, sam, addressableNow, addressable2030, prodDefs, cagrs, maxAbsCagr,
      regions, maxRegion, maxGrabs, roomsTotal, sizes, grabsTotal, deviceTamTotal, ctrlTotal, maxSizeTam, impliedEmployeesPerRoom, equippedSpendB, refreshRevenueB,
      somRows, somNow, som30, maxSom, ai, aiFirst, aiLast, aiAgentRev30, aiResRev30, aiWorkerRev30, maxModeRev, gridRows };
  }

  function headerHTML(v) {
    const scenBtn = (key) => {
      const on = v.scen === key, dark = key === 'Bull';
      return `<button data-scen="${key}" style="background:${on ? SCEN[key].color : 'transparent'};border:none;color:${on ? (dark ? 'var(--c-ink-fixed)' : '#fff') : 'var(--c-muted)'};font-size:11.5px;font-weight:600;letter-spacing:.06em;padding:8px 14px;border-radius:6px;cursor:pointer">${key}</button>`;
    };
    const liveDot = liveStatus === 'live' ? `<span style="color:var(--c-edge)">● Live sheet data</span>` :
      liveStatus === 'loading' ? `<span style="color:var(--c-dim)">○ Loading live data…</span>` :

        <div style="display:flex;flex-direction:column;gap:6px">
          <div style="font-size:11.5px;font-weight:500">Segment?</div>
          <div style="display:flex;gap:4px">${segBtn('all','All')}${segBtn('smb','SMB')}${segBtn('mid','Mid')}${segBtn('ent','Ent.')}</div>
        </div>
        <div style="font-size:10.5px;color:var(--c-dim);line-height:1.4">${v.dep.note}${state.sizeSegment!=='all' ? ' Segment split is Modelled-Directional \u2014 see Methodology.' : ''}</div>
      </div>
      ${groups.map(g => `<details data-group="${g.key}" ${state.openGroups[g.key] ? 'open' : ''} style="display:flex;flex-direction:column">
        <summary style="cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--c-trust-lift);font-weight:600;border-bottom:1px solid var(--c-rule);padding-bottom:7px;margin-bottom:12px">
          <span>${g.title}</span><span class="detailsChevron" style="font-size:10px;color:var(--c-dim)">\u25be</span>
        </summary>
        <div style="display:flex;flex-direction:column;gap:14px;padding-bottom:4px">${g.items.join('')}</div>
      </details>`).join('')}
      ${aiLeversHTML}
      <button id="resetBtn" style="margin-top:2px;background:transparent;border:1px solid var(--c-border);color:var(--c-muted);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:9px 12px;border-radius:7px;cursor:pointer">Reset to calibrated</button>
      <div style="border-top:1px solid var(--c-rule);padding-top:14px;font-size:11.5px;color:var(--c-dim);line-height:1.5">Counts are formal, registered and officially-estimated entities. ARPUs and cloud shares are calibrated to published 2024 analyst figures; the SAM weight and the UC seat base/cloud-share split are computed live from each country&#39;s World Bank readiness tier where available (seat and cloud-share figures are Modelled-Directional, sourced from ITU connectivity data and World Bank Enterprise Surveys — see Methodology tab). Everything downstream is model output, not measurement.</div>
    </aside>`;
  }

  function render() {
    const v = build();
    const tabHTML = { overview: overviewHTML, forecast: forecastHTML, regions: regionsHTML, rooms: roomsHTML, compete: competeHTML, ai: aiHTML }[v.tab](v);
    document.getElementById('app').innerHTML = `
      <div data-page="true" style="min-height:100vh;background:var(--c-bg);color:var(--c-text);padding:28px 32px 56px">
        ${headerHTML(v)}
        <div data-shell="true" style="display:grid;grid-template-columns:minmax(0,1fr) 268px;gap:28px;align-items:start">
          <main style="min-width:0">${tabHTML}</main>
          ${railHTML(v)}
        </div>
      </div>`;
    document.documentElement.setAttribute('data-theme', state.theme);
    wireEvents();
  }

  function wireEvents() {
    document.querySelectorAll('[data-tab]').forEach(el => el.onclick = () => setState({ tab: el.dataset.tab }));
    document.querySelectorAll('[data-scen]').forEach(el => el.onclick = () => setState({ scenario: el.dataset.scen }));
    document.querySelectorAll('[data-deploy]').forEach(el => el.onclick = () => setState({ deploy: el.dataset.deploy }));
    document.querySelectorAll('[data-sizeseg]').forEach(el => el.onclick = () => setState({ sizeSegment: el.dataset.sizeseg }));
    document.querySelectorAll('[data-aimode]').forEach(el => el.onclick = () => setState({ aiMode: el.dataset.aimode }));
    document.querySelectorAll('[data-lever]').forEach(el => el.oninput = () => setState({ [el.dataset.lever]: parseFloat(el.value) }));
    document.querySelectorAll('[data-levermonthly]').forEach(el => el.oninput = () => setState({ [el.dataset.levermonthly]: parseFloat(el.value) * 12 }));
    document.querySelectorAll('details[data-group]').forEach(el => el.ontoggle = () => { state.openGroups = { ...state.openGroups, [el.dataset.group]: el.open }; });
    const themeBtn = document.getElementById('themeBtn');
    if (themeBtn) themeBtn.onclick = () => setState({ theme: state.theme === 'light' ? 'dark' : 'light' });
    const resetBtn = document.getElementById('resetBtn');
    if (resetBtn) resetBtn.onclick = () => setState({ ...DEFAULTS() });
  }

  render();
  loadLiveModel().then(data => {
    LIVE = data;
    const gotRegions = data.regionsForecast && data.regionsForecast.length === 10;
    const gotRooms = data.roomSizes && data.roomSizes.length === 3;
    const gotDemand = data.demandDefaults && Object.keys(data.demandDefaults).length > 0;
    const gotSom = data.somDef && data.somDef.length === 5;
    const gotReadiness = data.readinessTiers && data.readinessTiers.length > 0;
    const gotAdoption = data.seats0Adoption && data.ucShare0Adoption;
    liveStatus = (gotRegions || gotRooms || gotDemand || gotSom || gotReadiness || gotAdoption) ? 'live' : 'fallback';
    if (gotDemand) Object.assign(state, data.demandDefaults);
    render();
  }).catch(err => { console.warn('Live model load failed entirely, using baseline:', err); liveStatus = 'fallback'; render(); });
})();
</script>
</body>
</html>
